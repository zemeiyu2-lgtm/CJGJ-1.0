<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌱 晨光书房</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js">
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background: #E8F3EE;
            color: #2A4B41;
            padding: 20px 16px 100px 16px;
            min-height: 100vh;
        }
        .container { max-width: 460px; margin: 0 auto; }

        /* 欢迎页 */
        .welcome-box {
            background: #FCF8F0;
            border-radius: 28px;
            padding: 48px 28px 36px 28px;
            box-shadow: 0 12px 30px rgba(42,75,65,0.08);
            text-align: center;
            margin-bottom: 20px;
        }
        .welcome-box .logo { font-size: 64px; margin-bottom: 12px; }
        .welcome-box h1 { font-size: 28px; font-weight: 700; color: #2A4B41; }
        .welcome-box .sub {
            font-size: 16px;
            color: #6B8A7A;
            margin: 8px 0 28px 0;
            line-height: 1.6;
        }
        .welcome-box .btn-start {
            background: #2A4B41;
            color: #FCF8F0;
            border: none;
            padding: 16px 0;
            width: 100%;
            border-radius: 40px;
            font-weight: 700;
            font-size: 20px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 16px rgba(42,75,65,0.25);
        }
        .welcome-box .btn-start:active { transform: scale(0.97); opacity: 0.8; }
        .welcome-box .btn-start .hint {
            display: block;
            font-weight: 400;
            font-size: 13px;
            color: #B8C9C0;
            margin-top: 4px;
        }
        .welcome-box .features {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #E8F3EE;
        }
        .welcome-box .features .item {
            font-size: 12px;
            color: #6B8A7A;
            line-height: 1.4;
        }
        .welcome-box .features .item .icon { font-size: 24px; display: block; margin-bottom: 4px; }

        /* 用户栏（学习界面顶部） */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FCF8F0;
            padding: 10px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(42,75,65,0.06);
        }
        .user-bar .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
            flex-wrap: wrap;
        }
        .user-bar .user-info .avatar {
            background: #D49B6B;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
        }
        .user-bar .user-info .badge-anon {
            background: #E8DFD4;
            color: #6B8A7A;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }
        .user-bar .user-info .badge-user {
            background: #D49B6B;
            color: white;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }
        .user-bar .btn-bind {
            background: none;
            border: 1px solid #D49B6B;
            color: #D49B6B;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.15s;
        }
        .user-bar .btn-bind:active { transform: scale(0.95); }

        /* 绑定弹窗 */
        .bind-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(42,75,65,0.5);
            backdrop-filter: blur(6px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }
        .bind-overlay.show { display: flex; }
        .bind-box {
            background: #FCF8F0;
            max-width: 380px;
            width: 100%;
            padding: 32px 24px 28px 24px;
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            animation: scaleUp 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }
        .bind-box h3 { font-size: 20px; margin-bottom: 6px; color: #2A4B41; }
        .bind-box .sub { font-size: 14px; color: #6B8A7A; margin-bottom: 18px; }
        .bind-box label { display: block; font-weight: 600; font-size: 14px; margin-top: 12px; margin-bottom: 4px; color: #3D5A50; }
        .bind-box input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #D3E0D9;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            background: white;
            transition: 0.2s;
        }
        .bind-box input:focus {
            outline: none;
            border-color: #D49B6B;
            box-shadow: 0 0 0 3px rgba(212,155,107,0.15);
        }
        .bind-box .btn-bind-confirm {
            background: #2A4B41;
            color: #FCF8F0;
            border: none;
            padding: 14px 0;
            width: 100%;
            border-radius: 40px;
            font-weight: 600;
            font-size: 17px;
            cursor: pointer;
            margin-top: 16px;
            transition: 0.15s;
        }
        .bind-box .btn-bind-confirm:active { transform: scale(0.97); opacity: 0.8; }
        .bind-box .btn-bind-close {
            background: none;
            border: none;
            color: #8AA39A;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
            text-decoration: underline;
        }
        .bind-box .bind-error {
            color: #B33C3C;
            font-size: 14px;
            margin-top: 10px;
            background: #F8DDDD;
            padding: 8px 14px;
            border-radius: 8px;
            display: none;
        }
        .bind-box .bind-error.show { display: block; }
        .bind-box .bind-success {
            color: #155724;
            font-size: 14px;
            margin-top: 10px;
            background: #D4EDDA;
            padding: 8px 14px;
            border-radius: 8px;
            display: none;
        }
        .bind-box .bind-success.show { display: block; }

        /* 后续样式与之前相同，此处略，完整版包含全部 */
        /* ... 为了简洁，以下省略重复样式，但实际代码会完整包含 */

        .hidden { display: none !important; }
        @keyframes scaleUp { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== 欢迎页 ===== -->
    <div id="welcomeArea">
        <div class="welcome-box">
            <div class="logo">🌱</div>
            <h1>晨光书房</h1>
            <p class="sub">
                按天学习雅各书<br>
                在真理中自觉成长
            </p>
            <button class="btn-start" id="btnStartLearning">
                📖 开始学习
                <span class="hint">无需注册 · 进度自动保存</span>
            </button>
            <div class="features">
                <div class="item"><span class="icon">📚</span>21课+3安息日</div>
                <div class="item"><span class="icon">🧠</span>4步自觉思考</div>
                <div class="item"><span class="icon">⭐</span>积分激励系统</div>
            </div>
        </div>
    </div>

    <!-- ===== 学习界面 ===== -->
    <div id="studyArea" class="hidden">
        <!-- 用户栏 -->
        <div class="user-bar">
            <div class="user-info">
                <div class="avatar" id="userAvatar">👤</div>
                <span id="userName">访客</span>
                <span class="badge-anon" id="userBadge">🕊️ 匿名</span>
                <span class="score" id="userScore">⭐ 0分</span>
            </div>
            <button class="btn-bind" id="btnBindAccount">📧 绑定账号</button>
        </div>

        <!-- 原有学习内容 -->
        <div class="header">
            <h1>🌱 晨光<span>· 自觉书房</span></h1>
            <span class="badge-day" id="dayBadge">加载中...</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <!-- ... 其他学习内容与之前相同 ... -->
    </div>

    <!-- ===== 绑定弹窗 ===== -->
    <div class="bind-overlay" id="bindOverlay">
        <div class="bind-box">
            <h3>📧 绑定邮箱</h3>
            <p class="sub">绑定后可在其他设备继续学习</p>
            <div id="bindError" class="bind-error"></div>
            <div id="bindSuccess" class="bind-success"></div>
            <label>邮箱</label>
            <input type="email" id="bindEmail" placeholder="你的邮箱">
            <label>密码</label>
            <input type="password" id="bindPassword" placeholder="至少6位">
            <button class="btn-bind-confirm" id="btnBindConfirm">绑定并同步</button>
            <button class="btn-bind-close" id="btnBindClose">稍后再说</button>
        </div>
    </div>

    <!-- ===== 激励弹窗 ===== -->
    <div class="modal-overlay" id="celebrationModal">...</div>

</div>

<script>
    // ★★★ 在这里填写你的 Supabase 配置 ★★★
    var SUPABASE_URL = 'https://你的项目ID.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_你的公钥';
    // ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★

    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    var currentUser = null;
    var courseData = [];
    var state = { ... };

    // --- 匿名登录 ---
    async function signInAnonymously() {
        var { data, error } = await supabase.auth.signInAnonymously();
        if (error) {
            console.error('匿名登录失败:', error);
            return null;
        }
        return data.user;
    }

    // --- 绑定账号（将匿名账号转为正式账号） ---
    async function linkAccount(email, password) {
        var { data, error } = await supabase.auth.updateUser({
            email: email,
            password: password
        });
        return { data, error };
    }

    // --- 其他函数与之前相同，完整版包含全部 ---
</script>
</body>
</html>
