<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌱 自觉书房 · 学习端</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background: #E8F3EE;
            color: #2A4B41;
            padding: 20px 16px 100px 16px;
            min-height: 100vh;
        }
        .container { max-width: 460px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #2A4B41; }
        .header h1 span { font-weight: 300; font-size: 16px; color: #6B8A7A; }
        .badge-day {
            background: #D49B6B;
            color: #FCF8F0;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(212, 155, 107, 0.3);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            background: #FCF8F0;
            padding: 16px 12px;
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(42, 75, 65, 0.06);
        }
        .day-dot {
            aspect-ratio: 1/1;
            border-radius: 50%;
            background: #E2E8E4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: #8AA39A;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .day-dot.completed {
            background: #2A4B41;
            color: #FCF8F0;
            border-color: #D49B6B;
            box-shadow: 0 2px 6px rgba(42, 75, 65, 0.2);
        }
        .day-dot.active {
            border-color: #D49B6B;
            background: #FCF8F0;
            color: #2A4B41;
            transform: scale(1.05);
            font-weight: 700;
        }
        .day-dot.future { opacity: 0.5; }
        .day-dot.sabbath {
            background: #F0E5D8;
            color: #B8A188;
            border-color: #DACBB8;
            font-size: 8px;
        }
        .day-dot.sabbath.completed {
            background: #DACBB8;
            color: #5B4B3A;
            border-color: #B8A188;
        }
        .main-card {
            background: #FCF8F0;
            border-radius: 28px;
            padding: 24px 20px 20px 20px;
            box-shadow: 0 12px 30px rgba(42, 75, 65, 0.08);
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .day-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: #2A4B41; }
        .day-sub {
            font-size: 14px;
            color: #6B8A7A;
            border-bottom: 2px solid #E8F3EE;
            padding-bottom: 14px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
        }
        .step-block {
            background: #F4F9F6;
            border-radius: 16px;
            padding: 16px 16px 12px 16px;
            margin-bottom: 14px;
            border-left: 4px solid #D49B6B;
            transition: all 0.25s;
            opacity: 0.6;
            pointer-events: none;
        }
        .step-block.unlocked { opacity: 1; pointer-events: auto; }
        .step-block.completed {
            border-left-color: #2A4B41;
            background: #E8F3EE;
            opacity: 0.85;
        }
        .step-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 15px;
            color: #2A4B41;
        }
        .step-header .step-num {
            background: #D49B6B;
            color: #FCF8F0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }
        .step-block.completed .step-num { background: #2A4B41; }
        .step-body { padding-left: 34px; }
        .step-body p { font-size: 15px; line-height: 1.6; color: #3D5A50; margin-bottom: 10px; }
        .step-body textarea {
            width: 100%;
            border: 1px solid #D3E0D9;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            background: white;
            resize: vertical;
            min-height: 70px;
            color: #2A4B41;
            transition: 0.2s;
        }
        .step-body textarea:focus {
            outline: none;
            border-color: #D49B6B;
            box-shadow: 0 0 0 3px rgba(212, 155, 107, 0.15);
        }
        .step-body textarea:disabled { background: #F4F9F6; color: #8AA39A; }
        .char-counter { text-align: right; font-size: 12px; color: #8AA39A; margin-top: 4px; }
        .reading-text { font-size: 16px; line-height: 1.9; color: #2A4B41; padding: 6px 0; }
        .reading-text p { margin-bottom: 14px; text-indent: 2em; }
        .reading-text .highlight-block {
            background: #DCE9E3;
            padding: 12px 16px;
            border-radius: 12px;
            border-left: 4px solid #D49B6B;
            margin: 12px 0;
            font-size: 0.95em;
            text-indent: 0;
        }
        .reading-text ul { padding-left: 20px; line-height: 2; }
        .reading-text ul li { list-style-type: none; }
        .reading-text ul li::before { content: "• "; color: #D49B6B; font-weight: 700; }
        .btn-step {
            background: #D49B6B;
            color: #FCF8F0;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.15s;
            box-shadow: 0 4px 10px rgba(212, 155, 107, 0.2);
            width: 100%;
        }
        .btn-step:active { transform: scale(0.97); opacity: 0.8; }
        .btn-step:disabled { opacity: 0.4; box-shadow: none; pointer-events: none; }
        .btn-step.complete-btn { background: #2A4B41; box-shadow: 0 4px 10px rgba(42, 75, 65, 0.2); }
        .progress-ring-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 10px 0;
            padding-top: 12px;
            border-top: 2px solid #E8F3EE;
        }
        .ring-container { position: relative; width: 60px; height: 60px; }
        .ring-container svg { transform: rotate(-90deg); }
        .ring-bg { fill: none; stroke: #E2E8E4; stroke-width: 6; }
        .ring-progress {
            fill: none;
            stroke: #2A4B41;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 138.23;
            stroke-dashoffset: 138.23;
            transition: stroke-dashoffset 0.5s ease;
        }
        .ring-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: 700;
            color: #2A4B41;
        }
        .progress-text { font-size: 15px; color: #6B8A7A; font-weight: 500; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(42, 75, 65, 0.5);
            backdrop-filter: blur(6px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 30px;
            animation: fadeIn 0.3s;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #FCF8F0;
            max-width: 380px;
            width: 100%;
            padding: 32px 24px 28px 24px;
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: scaleUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-box .emoji-big { font-size: 48px; margin-bottom: 8px; }
        .modal-box h3 { font-size: 20px; color: #2A4B41; margin-bottom: 6px; }
        .modal-box .verse {
            font-size: 17px;
            line-height: 1.6;
            color: #3D5A50;
            background: #E8F3EE;
            padding: 16px 18px;
            border-radius: 16px;
            margin: 12px 0 18px 0;
            font-style: italic;
            border-left: 4px solid #D49B6B;
            text-align: left;
        }
        .modal-box .verse-ref { text-align: right; font-size: 14px; font-weight: 600; color: #D49B6B; margin-top: -10px; margin-bottom: 12px; font-style: normal; }
        .modal-box .btn-modal {
            background: #2A4B41;
            color: #FCF8F0;
            border: none;
            padding: 12px 0;
            width: 100%;
            border-radius: 40px;
            font-weight: 600;
            font-size: 17px;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal-box .btn-modal:active { transform: scale(0.97); }
        .star-burst {
            position: fixed;
            pointer-events: none;
            font-size: 30px;
            z-index: 1000;
            animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-200px) scale(1.5) rotate(40deg); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        .sabbath-mode .step-block { opacity: 0.5; pointer-events: none; }
        .sabbath-mode .step-block.unlocked { opacity: 0.5; pointer-events: none; }
        .sabbath-mode .btn-step { display: none; }
        .sabbath-mode .progress-ring-wrap { display: none; }
        .sabbath-mode #btnCompleteDay { display: none; }
        .loading-overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
            font-size: 18px;
            color: #6B8A7A;
        }
        .loading-overlay .spinner {
            width: 30px;
            height: 30px;
            border: 4px solid #E2E8E4;
            border-top-color: #2A4B41;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg {
            background: #F8DDDD;
            color: #B33C3C;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 16px;
            border-left: 4px solid #B33C3C;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 晨光<span>· 自觉书房</span></h1>
            <span class="badge-day" id="dayBadge">加载中...</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <div class="main-card" id="mainCard">
            <div id="loadingArea">
                <div class="loading-overlay">
                    <div class="spinner"></div>
                    <span>📖 正在加载课程数据...</span>
                </div>
            </div>
            <div id="contentArea" style="display:none;">
                <div class="day-title" id="dayTitle"></div>
                <div class="day-sub">
                    <span id="daySubDate"></span>
                    <span class="day-sub-status" id="daySubStatus">🌱 未开始</span>
                </div>
                <div class="step-block" id="step1">
                    <div class="step-header"><span class="step-num">1</span><span>📖 静读 · 领受</span></div>
                    <div class="step-body">
                        <div class="reading-text" id="readingContent"></div>
                        <button class="btn-step" id="btnStep1">⏳ 我已读完 (需停留 30 秒)</button>
                        <div style="font-size:13px; color:#8AA39A; margin-top:6px;" id="timerHint">请慢慢阅读，不要着急...</div>
                    </div>
                </div>
                <div class="step-block" id="step2">
                    <div class="step-header"><span class="step-num">2</span><span>🎯 捕获 · 触动</span></div>
                    <div class="step-body">
                        <p>✍️ 哪句话最触动你？把它摘录下来：</p>
                        <textarea id="inputStep2" placeholder="例如：'你们中间若有缺少智慧的，应当求那厚赐众人的神...'" disabled></textarea>
                        <div class="char-counter"><span id="count2">0</span> / 至少 10 字</div>
                        <button class="btn-step" id="btnStep2" disabled>✅ 确认捕获</button>
                    </div>
                </div>
                <div class="step-block" id="step3">
                    <div class="step-header"><span class="step-num">3</span><span>🔗 联结 · 内化</span></div>
                    <div class="step-body">
                        <p>💭 这让我想起自己经历或认知中的什么？</p>
                        <textarea id="inputStep3" placeholder="请写下一段真实的联想（至少10个字）..." disabled></textarea>
                        <div class="char-counter"><span id="count3">0</span> / 至少 10 字</div>
                        <button class="btn-step" id="btnStep3" disabled>✅ 确认联结</button>
                    </div>
                </div>
                <div class="step-block" id="step4">
                    <div class="step-header"><span class="step-num">4</span><span>🕊️ 追问 · 应用</span></div>
                    <div class="step-body">
                        <p id="hookQuestionText">加载钩子问题...</p>
                        <textarea id="inputStep4" placeholder="请写下你的行动回应（至少10个字）..." disabled></textarea>
                        <div class="char-counter"><span id="count4">0</span> / 至少 10 字</div>
                        <button class="btn-step" id="btnStep4" disabled>✅ 确认应用</button>
                    </div>
                </div>
                <div class="progress-ring-wrap">
                    <div class="ring-container">
                        <svg viewBox="0 0 48 48" width="60" height="60">
                            <circle class="ring-bg" cx="24" cy="24" r="22"></circle>
                            <circle class="ring-progress" id="ringProgress" cx="24" cy="24" r="22"></circle>
                        </svg>
                        <div class="ring-label" id="ringLabel">0%</div>
                    </div>
                    <div class="progress-text" id="progressText">今日 0 / 4 步</div>
                </div>
                <button class="btn-step complete-btn" id="btnCompleteDay" disabled>🔒 完成今日学习</button>
            </div>
        </div>
        <div style="text-align:center; font-size:13px; color:#8AA39A; margin-top:10px;">进度自动保存 · 祢的话是我脚前的灯</div>
    </div>
    <div class="modal-overlay" id="celebrationModal">
        <div class="modal-box">
            <div class="emoji-big" id="modalEmoji">⭐</div>
            <h3 id="modalTitle">太棒了！</h3>
            <div class="verse" id="modalVerse">“你的话是我脚前的灯，是我路上的光。”</div>
            <div class="verse-ref" id="modalRef">— 诗篇 119:105</div>
            <button class="btn-modal" id="modalBtn">❤️ 阿们，继续前行</button>
        </div>
    </div>
    <script>
        var bibleVerses = [
            { text: "你的话是我脚前的灯，是我路上的光。", ref: "诗篇 119:105" },
            { text: "我靠着那加给我力量的，凡事都能做。", ref: "腓立比书 4:13" },
            { text: "你当刚强壮胆！不要惧怕，也不要惊惶，因为你无论往哪里去，耶和华你的神必与你同在。", ref: "约书亚记 1:9" },
            { text: "因为耶和华赐人智慧，知识和聪明都由他口而出。", ref: "箴言 2:6" },
            { text: "你们中间若有缺少智慧的，应当求那厚赐与众人、也不斥责人的神，主就必赐给他。", ref: "雅各书 1:5" },
            { text: "不要效法这个世界，只要心意更新而变化，叫你们察验何为神的善良、纯全、可喜悦的旨意。", ref: "罗马书 12:2" },
            { text: "但那等候耶和华的必从新得力。他们必如鹰展翅上腾，他们奔跑却不困倦，行走却不疲乏。", ref: "以赛亚书 40:31" },
            { text: "神能照着运行在我们心里的大力，充充足足地成就一切，超过我们所求所想的。", ref: "以弗所书 3:20" },
            { text: "你要专心仰赖耶和华，不可倚靠自己的聪明，在你一切所行的事上都要认定他，他必指引你的路。", ref: "箴言 3:5-6" },
            { text: "你的日子如何，你的力量也必如何。", ref: "申命记 33:25" },
            { text: "我们晓得万事都互相效力，叫爱神的人得益处，就是按他旨意被召的人。", ref: "罗马书 8:28" },
            { text: "你们要将一切的忧虑卸给神，因为他顾念你们。", ref: "彼得前书 5:7" },
            { text: "神所赐出人意外的平安，必在基督耶稣里保守你们的心怀意念。", ref: "腓立比书 4:7" }
        ];
        var courseData = [];
        var state = { currentDay: 0, steps: { 1: { completed: false, timerDone: false }, 2: { completed: false, text: '' }, 3: { completed: false, text: '' }, 4: { completed: false, text: '' } }, completedDays: [] };
        var timerInterval = null, timerSeconds = 0;
        var dataLoaded = false;

        function $(id) { return document.getElementById(id); }
        function shuffleArray(arr) { for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var temp = arr[i]; arr[i] = arr[j]; arr[j] = temp; } return arr; }
        function getRandomVerse() { var shuffled = shuffleArray(bibleVerses.slice()); return shuffled[0]; }
        function getStepCount() { var c = 0; for (var i = 1; i <= 4; i++) { if (state.steps[i].completed) c++; } return c; }
        function getProgressPercent() { return Math.round((getStepCount() / 4) * 100); }
        function isSabbathDay(index) { return courseData[index] && courseData[index].isSabbath === true; }
        function saveState() { try { localStorage.setItem('soul_study_state', JSON.stringify(state)); } catch (e) {} }
        function loadState() { try { var saved = localStorage.getItem('soul_study_state'); if (saved) { var parsed = JSON.parse(saved); if (parsed.currentDay !== undefined) state.currentDay = parsed.currentDay; if (parsed.steps) state.steps = parsed.steps; if (parsed.completedDays) state.completedDays = parsed.completedDays; } } catch (e) {} }

        function burstStars() {
            var emojis = ['⭐', '✨', '🌟', '💫', '🌿', '🕊️'];
            for (var i = 0; i < 6; i++) {
                (function(i) {
                    setTimeout(function() {
                        var el = document.createElement('div');
                        el.className = 'star-burst';
                        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                        el.style.left = (10 + Math.random() * 80) + '%';
                        el.style.top = (20 + Math.random() * 50) + '%';
                        el.style.fontSize = (20 + Math.random() * 25) + 'px';
                        document.body.appendChild(el);
                        setTimeout(function() { el.remove(); }, 1500);
                    }, i * 100);
                })(i);
            }
        }

        function showCelebration(stepNum) {
            var verse = getRandomVerse();
            var messages = {
                1: { emoji: '📖', title: '领受话语，如鹿渴慕溪水！' },
                2: { emoji: '🎯', title: '你抓住了真理的亮光！' },
                3: { emoji: '🔗', title: '主的话语正在你生命中生根！' },
                4: { emoji: '🕊️', title: '行出真理，磐石之上！' }
            };
            var msg = messages[stepNum] || messages[1];
            $('modalEmoji').textContent = msg.emoji;
            $('modalTitle').textContent = msg.title;
            $('modalVerse').textContent = '“' + verse.text + '”';
            $('modalRef').textContent = '— ' + verse.ref;
            $('celebrationModal').classList.add('show');
            burstStars();
            try {
                var ctx = new(window.AudioContext || window.webkitAudioContext)();
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 880;
                osc.type = 'sine';
                gain.gain.value = 0.15;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
                osc.stop(ctx.currentTime + 0.6);
            } catch (e) {}
        }

        function renderCalendar() {
            var grid = $('calendarGrid');
            grid.innerHTML = '';
            for (var i = 0; i < courseData.length; i++) {
                var dot = document.createElement('div');
                dot.className = 'day-dot';
                var isSabbath = courseData[i] && courseData[i].isSabbath === true;
                if (isSabbath) dot.classList.add('sabbath');
                dot.textContent = isSabbath ? '🕊️' : (i + 1);
                if (state.completedDays.indexOf(i) !== -1) {
                    dot.classList.add('completed');
                } else if (i === state.currentDay) {
                    dot.classList.add('active');
                } else if (i > state.currentDay) {
                    dot.classList.add('future');
                }
                grid.appendChild(dot);
            }
        }

        function updateStepsUI() {
            var s = state.steps;
            var isSabbath = isSabbathDay(state.currentDay);
            if (isSabbath) {
                $('mainCard').classList.add('sabbath-mode');
                $('step1').classList.add('unlocked');
                $('step2').classList.remove('unlocked');
                $('step3').classList.remove('unlocked');
                $('step4').classList.remove('unlocked');
                $('inputStep2').disabled = true;
                $('inputStep3').disabled = true;
                $('inputStep4').disabled = true;
                $('btnStep1').disabled = true;
                $('btnStep2').disabled = true;
                $('btnStep3').disabled = true;
                $('btnStep4').disabled = true;
                $('btnCompleteDay').disabled = true;
                $('btnCompleteDay').textContent = '🕊️ 今天是安息日';
                $('timerHint').textContent = '🕊️ 安息日 · 享受神的同在';
                $('timerHint').style.color = '#B8A188';
                var pct2 = 100;
                var circ = 138.23;
                var off2 = circ - (pct2 / 100) * circ;
                $('ringProgress').style.strokeDashoffset = off2;
                $('ringLabel').textContent = '🕊️';
                $('progressText').textContent = '今日安息 · 默想';
                $('daySubStatus').textContent = '🕊️ 安息日';
                return;
            } else {
                $('mainCard').classList.remove('sabbath-mode');
            }
            $('step1').classList.add('unlocked');
            if (s[1].completed) { $('step1').classList.add('completed'); } else { $('step1').classList.remove('completed'); }
            if (s[1].completed) { $('step2').classList.add('unlocked'); $('inputStep2').disabled = false; } else { $('step2').classList.remove('unlocked'); $('inputStep2').disabled = true; }
            if (s[2].completed) { $('step2').classList.add('completed'); $('inputStep2').disabled = true; } else { $('step2').classList.remove('completed'); }
            if (s[2].completed) { $('step3').classList.add('unlocked'); $('inputStep3').disabled = false; } else { $('step3').classList.remove('unlocked'); $('inputStep3').disabled = true; }
            if (s[3].completed) { $('step3').classList.add('completed'); $('inputStep3').disabled = true; } else { $('step3').classList.remove('completed'); }
            if (s[3].completed) { $('step4').classList.add('unlocked'); $('inputStep4').disabled = false; } else { $('step4').classList.remove('unlocked'); $('inputStep4').disabled = true; }
            if (s[4].completed) { $('step4').classList.add('completed'); $('inputStep4').disabled = true; } else { $('step4').classList.remove('completed'); }
            $('btnStep1').textContent = s[1].completed ? '✅ 已完成静读' : '⏳ 我已读完 (需停留 30 秒)';
            $('btnStep2').textContent = s[2].completed ? '✅ 已捕获' : '✅ 确认捕获';
            $('btnStep3').textContent = s[3].completed ? '✅ 已联结' : '✅ 确认联结';
            $('btnStep4').textContent = s[4].completed ? '✅ 已应用' : '✅ 确认应用';
            $('btnStep1').disabled = s[1].completed || !s[1].timerDone;
            $('btnStep2').disabled = s[2].completed || $('inputStep2').value.length < 10;
            $('btnStep3').disabled = s[3].completed || $('inputStep3').value.length < 10;
            $('btnStep4').disabled = s[4].completed || $('inputStep4').value.length < 10;
            if (!s[1].completed && s[1].timerDone) {
                $('timerHint').textContent = '✅ 已满 30 秒，可以点击完成静读！';
                $('timerHint').style.color = '#2A4B41';
            } else if (!s[1].completed) {
                $('timerHint').textContent = '⏱️ 请阅读至少 30 秒 (已读 ' + timerSeconds + 's)';
                $('timerHint').style.color = '#8AA39A';
            } else {
                $('timerHint').textContent = '📖 静读已完成';
                $('timerHint').style.color = '#6B8A7A';
            }
            $('count2').textContent = $('inputStep2').value.length;
            $('count3').textContent = $('inputStep3').value.length;
            $('count4').textContent = $('inputStep4').value.length;
            var pct = getProgressPercent();
            var circumference = 138.23;
            var offset = circumference - (pct / 100) * circumference;
            $('ringProgress').style.strokeDashoffset = offset;
            $('ringLabel').textContent = pct + '%';
            $('progressText').textContent = '今日 ' + getStepCount() + ' / 4 步';
            var allDone = s[1].completed && s[2].completed && s[3].completed && s[4].completed;
            if (allDone) {
                $('btnCompleteDay').disabled = false;
                $('btnCompleteDay').textContent = '🎉 完成今日学习！';
            } else {
                $('btnCompleteDay').disabled = true;
                $('btnCompleteDay').textContent = '🔒 完成全部 4 步 (' + getStepCount() + '/4)';
            }
            if (allDone) { $('daySubStatus').textContent = '✅ 已完成'; } else if (getStepCount() > 0) { $('daySubStatus').textContent = '🌱 进行中 (' + getStepCount() + '/4)'; } else { $('daySubStatus').textContent = '🌱 未开始'; }
        }

        function loadDay(index) {
            var data = courseData[index];
            if (!data) return;
            var totalDays = courseData.length;
            $('dayBadge').textContent = '第 ' + (index + 1) + ' / ' + totalDays + ' 天';
            $('dayTitle').textContent = data.title;
            $('daySubDate').textContent = '📅 第 ' + (index + 1) + ' 课';
            $('readingContent').innerHTML = data.reading;
            $('hookQuestionText').innerHTML = '🕊️ ' + data.hook;
            if (!state.steps[1].completed && !isSabbathDay(index)) {
                timerSeconds = 0;
                state.steps[1].timerDone = false;
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            }
            $('inputStep2').value = state.steps[2].text || '';
            $('inputStep3').value = state.steps[3].text || '';
            $('inputStep4').value = state.steps[4].text || '';
            if (!state.steps[1].completed && !state.steps[1].timerDone && !isSabbathDay(index)) {
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(function() {
                    timerSeconds++;
                    if (timerSeconds >= 30) {
                        state.steps[1].timerDone = true;
                        updateStepsUI();
                        if (timerInterval) clearInterval(timerInterval);
                        timerInterval = null;
                    }
                    updateStepsUI();
                }, 1000);
            }
            renderCalendar();
            updateStepsUI();
            saveState();
        }

        function completeStep(stepNum) {
            if (isSabbathDay(state.currentDay)) return;
            if (stepNum === 1) {
                if (!state.steps[1].timerDone) return;
                state.steps[1].completed = true;
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                showCelebration(1);
            } else if (stepNum === 2) {
                var text = $('inputStep2').value.trim();
                if (text.length < 10) return;
                state.steps[2].text = text;
                state.steps[2].completed = true;
                showCelebration(2);
            } else if (stepNum === 3) {
                var text = $('inputStep3').value.trim();
                if (text.length < 10) return;
                state.steps[3].text = text;
                state.steps[3].completed = true;
                showCelebration(3);
            } else if (stepNum === 4) {
                var text = $('inputStep4').value.trim();
                if (text.length < 10) return;
                state.steps[4].text = text;
                state.steps[4].completed = true;
                showCelebration(4);
            }
            updateStepsUI();
            saveState();
            if (getStepCount() === 4) { window.scrollTo({ top: 0, behavior: 'smooth' }); }
        }

        function completeDay() {
            if (isSabbathDay(state.currentDay)) return;
            var allDone = state.steps[1].completed && state.steps[2].completed && state.steps[3].completed && state.steps[4].completed;
            if (!allDone) return;
            if (state.completedDays.indexOf(state.currentDay) === -1) {
                state.completedDays.push(state.currentDay);
            }
            if (state.currentDay < courseData.length - 1) {
                state.steps = { 1: { completed: false, timerDone: false }, 2: { completed: false, text: '' }, 3: { completed: false, text: '' }, 4: { completed: false, text: '' } };
                state.currentDay++;
                while (state.completedDays.indexOf(state.currentDay) !== -1 && state.currentDay < courseData.length - 1) {
                    state.currentDay++;
                }
                loadDay(state.currentDay);
                setTimeout(function() {
                    var verse = getRandomVerse();
                    $('modalEmoji').textContent = '🌅';
                    $('modalTitle').textContent = '你忠于今日的托付！';
                    $('modalVerse').textContent = '“' + verse.text + '”';
                    $('modalRef').textContent = '— ' + verse.ref;
                    $('celebrationModal').classList.add('show');
                    burstStars();
                }, 400);
            } else {
                setTimeout(function() {
                    $('modalEmoji').textContent = '🕊️';
                    $('modalTitle').textContent = '🏁 你完成了全部旅程！';
                    $('modalVerse').textContent = '“那美好的仗我已经打过了，当跑的路我已经跑尽了，所信的道我已经守住了。”';
                    $('modalRef').textContent = '— 提摩太后书 4:7';
                    $('celebrationModal').classList.add('show');
                    burstStars();
                }, 400);
                $('btnCompleteDay').disabled = true;
                $('btnCompleteDay').textContent = '🎉 全部完成！哈利路亚！';
            }
            saveState();
        }

        function initEvents() {
            $('btnStep1').onclick = function() { completeStep(1); };
            $('btnStep2').onclick = function() { completeStep(2); };
            $('btnStep3').onclick = function() { completeStep(3); };
            $('btnStep4').onclick = function() { completeStep(4); };
            $('btnCompleteDay').onclick = completeDay;
            $('inputStep2').oninput = function() { state.steps[2].text = $('inputStep2').value; updateStepsUI(); saveState(); };
            $('inputStep3').oninput = function() { state.steps[3].text = $('inputStep3').value; updateStepsUI(); saveState(); };
            $('inputStep4').oninput = function() { state.steps[4].text = $('inputStep4').value; updateStepsUI(); saveState(); };
            $('readingContent').addEventListener('click', function(e) {
                var target = e.target.closest('p, .highlight-block');
                if (target && !state.steps[2].completed && state.steps[1].completed && !isSabbathDay(state.currentDay)) {
                    var text = target.textContent.trim();
                    if (text.length > 0) {
                        $('inputStep2').value = text;
                        state.steps[2].text = text;
                        updateStepsUI();
                        saveState();
                        target.style.transition = '0.1s';
                        target.style.backgroundColor = '#DCE9E3';
                        setTimeout(function() { target.style.backgroundColor = ''; }, 300);
                    }
                }
            });
            $('modalBtn').onclick = function() { $('celebrationModal').classList.remove('show'); };
            $('celebrationModal').onclick = function(e) { if (e.target === $('celebrationModal')) $('celebrationModal').classList.remove('show'); };
        }

        function loadDataFromJSON() {
            fetch('data.json')
                .then(function(response) {
                    if (!response.ok) { throw new Error('无法加载 data.json，状态码：' + response.status); }
                    return response.json();
                })
                .then(function(data) {
                    courseData = data;
                    dataLoaded = true;
                    $('loadingArea').style.display = 'none';
                    $('contentArea').style.display = 'block';
                    loadState();
                    while (state.completedDays.indexOf(state.currentDay) !== -1 && state.currentDay < courseData.length - 1) {
                        state.currentDay++;
                    }
                    if (state.currentDay >= courseData.length) { state.currentDay = courseData.length - 1; }
                    if (courseData.length === 0) {
                        $('dayTitle').textContent = '📭 暂无课程数据';
                        $('daySubDate').textContent = '请管理员在后台添加课程';
                        return;
                    }
                    loadDay(state.currentDay);
                    initEvents();
                    console.log('🌱 数据加载成功，共 ' + courseData.length + ' 天课程');
                })
                .catch(function(error) {
                    $('loadingArea').innerHTML = '<div class="error-msg">❌ ' + error.message + '<br><br>请检查：<br>1. 仓库中是否存在 data.json 文件<br>2. data.json 格式是否正确<br>3. 稍后刷新页面重试</div>';
                    console.error('加载失败：', error);
                });
        }

        loadDataFromJSON();
    </script>
</body>
</html>
