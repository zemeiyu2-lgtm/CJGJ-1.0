<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌱 21天自觉思考 · 晨光书房</title>
    <style>
        /* ========== 全局重置 & 主题色 ========== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background: #E8F3EE;
            /* 晨雾绿 */
            color: #2A4B41;
            /* 深墨绿 */
            padding: 20px 16px 100px 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 460px;
            margin: 0 auto;
        }

        /* ========== 头部 & 日历 ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #2A4B41;
        }
        .header h1 span {
            font-weight: 300;
            font-size: 16px;
            color: #6B8A7A;
        }
        .badge-day {
            background: #D49B6B;
            color: #FCF8F0;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(212, 155, 107, 0.3);
        }

        /* 打卡网格 (7x3) */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            background: #FCF8F0;
            padding: 16px 12px;
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(42, 75, 65, 0.06);
        }
        .day-dot {
            aspect-ratio: 1/1;
            border-radius: 50%;
            background: #E2E8E4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: #8AA39A;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .day-dot.completed {
            background: #2A4B41;
            color: #FCF8F0;
            border-color: #D49B6B;
            box-shadow: 0 2px 6px rgba(42, 75, 65, 0.2);
        }
        .day-dot.active {
            border-color: #D49B6B;
            background: #FCF8F0;
            color: #2A4B41;
            transform: scale(1.05);
            font-weight: 700;
        }
        .day-dot.future {
            opacity: 0.5;
        }
        .day-dot.sabbath {
            background: #F0E5D8;
            color: #B8A188;
            border-color: #DACBB8;
            font-size: 8px;
        }
        .day-dot.sabbath.completed {
            background: #DACBB8;
            color: #5B4B3A;
            border-color: #B8A188;
        }

        /* ========== 主卡片 ========== */
        .main-card {
            background: #FCF8F0;
            border-radius: 28px;
            padding: 24px 20px 20px 20px;
            box-shadow: 0 12px 30px rgba(42, 75, 65, 0.08);
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .day-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #2A4B41;
        }
        .day-sub {
            font-size: 14px;
            color: #6B8A7A;
            border-bottom: 2px solid #E8F3EE;
            padding-bottom: 14px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
        }

        /* ========== 四步流程 (手风琴) ========== */
        .step-block {
            background: #F4F9F6;
            border-radius: 16px;
            padding: 16px 16px 12px 16px;
            margin-bottom: 14px;
            border-left: 4px solid #D49B6B;
            transition: all 0.25s;
            opacity: 0.6;
            pointer-events: none;
        }
        .step-block.unlocked {
            opacity: 1;
            pointer-events: auto;
        }
        .step-block.completed {
            border-left-color: #2A4B41;
            background: #E8F3EE;
            opacity: 0.85;
        }
        .step-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 15px;
            color: #2A4B41;
        }
        .step-header .step-num {
            background: #D49B6B;
            color: #FCF8F0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }
        .step-block.completed .step-num {
            background: #2A4B41;
        }
        .step-body {
            padding-left: 34px;
        }
        .step-body p {
            font-size: 15px;
            line-height: 1.6;
            color: #3D5A50;
            margin-bottom: 10px;
        }
        .step-body textarea {
            width: 100%;
            border: 1px solid #D3E0D9;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            background: white;
            resize: vertical;
            min-height: 70px;
            color: #2A4B41;
            transition: 0.2s;
        }
        .step-body textarea:focus {
            outline: none;
            border-color: #D49B6B;
            box-shadow: 0 0 0 3px rgba(212, 155, 107, 0.15);
        }
        .step-body textarea:disabled {
            background: #F4F9F6;
            color: #8AA39A;
        }
        .char-counter {
            text-align: right;
            font-size: 12px;
            color: #8AA39A;
            margin-top: 4px;
        }

        /* 阅读区可点击摘录 */
        .reading-text {
            font-size: 16px;
            line-height: 1.9;
            color: #2A4B41;
            padding: 6px 0;
        }
        .reading-text p {
            margin-bottom: 14px;
            text-indent: 2em;
        }
        .reading-text .highlight-block {
            background: #DCE9E3;
            padding: 12px 16px;
            border-radius: 12px;
            border-left: 4px solid #D49B6B;
            margin: 12px 0;
            font-size: 0.95em;
            text-indent: 0;
        }
        .reading-text ul {
            padding-left: 20px;
            line-height: 2;
        }
        .reading-text ul li {
            list-style-type: none;
        }
        .reading-text ul li::before {
            content: "• ";
            color: #D49B6B;
            font-weight: 700;
        }
        .clickable-para {
            cursor: pointer;
            transition: 0.1s;
            padding: 4px 0;
            border-radius: 4px;
        }
        .clickable-para:active {
            background: #DCE9E3;
        }

        .btn-step {
            background: #D49B6B;
            color: #FCF8F0;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.15s;
            box-shadow: 0 4px 10px rgba(212, 155, 107, 0.2);
            width: 100%;
        }
        .btn-step:active {
            transform: scale(0.97);
            opacity: 0.8;
        }
        .btn-step:disabled {
            opacity: 0.4;
            box-shadow: none;
            pointer-events: none;
        }
        .btn-step.complete-btn {
            background: #2A4B41;
            box-shadow: 0 4px 10px rgba(42, 75, 65, 0.2);
        }

        /* ========== 进度圆环 ========== */
        .progress-ring-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 10px 0;
            padding-top: 12px;
            border-top: 2px solid #E8F3EE;
        }
        .ring-container {
            position: relative;
            width: 60px;
            height: 60px;
        }
        .ring-container svg {
            transform: rotate(-90deg);
        }
        .ring-bg {
            fill: none;
            stroke: #E2E8E4;
            stroke-width: 6;
        }
        .ring-progress {
            fill: none;
            stroke: #2A4B41;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 138.23;
            stroke-dashoffset: 138.23;
            transition: stroke-dashoffset 0.5s ease;
        }
        .ring-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: 700;
            color: #2A4B41;
        }
        .progress-text {
            font-size: 15px;
            color: #6B8A7A;
            font-weight: 500;
        }

        /* ========== 弹窗 (激励) ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(42, 75, 65, 0.5);
            backdrop-filter: blur(6px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 30px;
            animation: fadeIn 0.3s;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: #FCF8F0;
            max-width: 380px;
            width: 100%;
            padding: 32px 24px 28px 24px;
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: scaleUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-box .emoji-big {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .modal-box h3 {
            font-size: 20px;
            color: #2A4B41;
            margin-bottom: 6px;
        }
        .modal-box .verse {
            font-size: 17px;
            line-height: 1.6;
            color: #3D5A50;
            background: #E8F3EE;
            padding: 16px 18px;
            border-radius: 16px;
            margin: 12px 0 18px 0;
            font-style: italic;
            border-left: 4px solid #D49B6B;
            text-align: left;
        }
        .modal-box .verse-ref {
            text-align: right;
            font-size: 14px;
            font-weight: 600;
            color: #D49B6B;
            margin-top: -10px;
            margin-bottom: 12px;
            font-style: normal;
        }
        .modal-box .btn-modal {
            background: #2A4B41;
            color: #FCF8F0;
            border: none;
            padding: 12px 0;
            width: 100%;
            border-radius: 40px;
            font-weight: 600;
            font-size: 17px;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal-box .btn-modal:active {
            transform: scale(0.97);
        }

        /* ========== 星星/飘落动画 ========== */
        .star-burst {
            position: fixed;
            pointer-events: none;
            font-size: 30px;
            z-index: 1000;
            animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.5) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-200px) scale(1.5) rotate(40deg);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes scaleUp {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ========== 工具类 ========== */
        .mt-8 {
            margin-top: 8px;
        }
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }

        /* Sabbath 特殊样式 */
        .sabbath-mode .step-block {
            opacity: 0.5;
            pointer-events: none;
        }
        .sabbath-mode .step-block.unlocked {
            opacity: 0.5;
            pointer-events: none;
        }
        .sabbath-mode .btn-step {
            display: none;
        }
        .sabbath-mode .progress-ring-wrap {
            display: none;
        }
        .sabbath-mode #btnCompleteDay {
            display: none;
        }
        .sabbath-mode .day-sub-status {
            color: #B8A188;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- 头部 -->
        <div class="header">
            <h1>🌱 晨光<span>· 自觉书房</span></h1>
            <span class="badge-day" id="dayBadge">第 1 / 24 天</span>
        </div>

        <!-- 日历 -->
        <div class="calendar-grid" id="calendarGrid">
            <!-- JS 渲染 24 个圆点 -->
        </div>

        <!-- 主卡片 -->
        <div class="main-card" id="mainCard">
            <div class="day-title" id="dayTitle">加载中...</div>
            <div class="day-sub">
                <span id="daySubDate">📅 第 1 课</span>
                <span class="day-sub-status" id="daySubStatus">🌱 未开始</span>
            </div>

            <!-- 步骤 1：静读 -->
            <div class="step-block" id="step1">
                <div class="step-header">
                    <span class="step-num">1</span>
                    <span>📖 静读 · 领受</span>
                </div>
                <div class="step-body">
                    <div class="reading-text" id="readingContent">
                        <!-- 动态渲染 -->
                    </div>
                    <button class="btn-step" id="btnStep1">⏳ 我已读完 (需停留 30 秒)</button>
                    <div style="font-size:13px; color:#8AA39A; margin-top:6px;" id="timerHint">请慢慢阅读，不要着急...</div>
                </div>
            </div>

            <!-- 步骤 2：捕获 -->
            <div class="step-block" id="step2">
                <div class="step-header">
                    <span class="step-num">2</span>
                    <span>🎯 捕获 · 触动</span>
                </div>
                <div class="step-body">
                    <p>✍️ 哪句话最触动你？把它摘录下来：</p>
                    <textarea id="inputStep2" placeholder="例如：'你们中间若有缺少智慧的，应当求那厚赐众人的神...'" disabled></textarea>
                    <div class="char-counter"><span id="count2">0</span> / 至少 10 字</div>
                    <button class="btn-step" id="btnStep2" disabled>✅ 确认捕获</button>
                </div>
            </div>

            <!-- 步骤 3：联结 -->
            <div class="step-block" id="step3">
                <div class="step-header">
                    <span class="step-num">3</span>
                    <span>🔗 联结 · 内化</span>
                </div>
                <div class="step-body">
                    <p>💭 这让我想起自己经历或认知中的什么？</p>
                    <textarea id="inputStep3" placeholder="请写下一段真实的联想（至少10个字）..." disabled></textarea>
                    <div class="char-counter"><span id="count3">0</span> / 至少 10 字</div>
                    <button class="btn-step" id="btnStep3" disabled>✅ 确认联结</button>
                </div>
            </div>

            <!-- 步骤 4：追问 -->
            <div class="step-block" id="step4">
                <div class="step-header">
                    <span class="step-num">4</span>
                    <span>🕊️ 追问 · 应用</span>
                </div>
                <div class="step-body">
                    <p id="hookQuestionText">加载钩子问题...</p>
                    <textarea id="inputStep4" placeholder="请写下你的行动回应（至少10个字）..." disabled></textarea>
                    <div class="char-counter"><span id="count4">0</span> / 至少 10 字</div>
                    <button class="btn-step" id="btnStep4" disabled>✅ 确认应用</button>
                </div>
            </div>

            <!-- 进度圆环 & 完成按钮 -->
            <div class="progress-ring-wrap">
                <div class="ring-container">
                    <svg viewBox="0 0 48 48" width="60" height="60">
                        <circle class="ring-bg" cx="24" cy="24" r="22"></circle>
                        <circle class="ring-progress" id="ringProgress" cx="24" cy="24" r="22"></circle>
                    </svg>
                    <div class="ring-label" id="ringLabel">0%</div>
                </div>
                <div class="progress-text" id="progressText">今日 0 / 4 步</div>
            </div>

            <button class="btn-step complete-btn" id="btnCompleteDay" disabled>🔒 完成今日学习</button>
        </div>

        <div style="text-align:center; font-size:13px; color:#8AA39A; margin-top:10px;">
            进度自动保存 · 祢的话是我脚前的灯
        </div>
    </div>

    <!-- ========== 激励弹窗 ========== -->
    <div class="modal-overlay" id="celebrationModal">
        <div class="modal-box">
            <div class="emoji-big" id="modalEmoji">⭐</div>
            <h3 id="modalTitle">太棒了！</h3>
            <div class="verse" id="modalVerse">“你的话是我脚前的灯，是我路上的光。”</div>
            <div class="verse-ref" id="modalRef">— 诗篇 119:105</div>
            <button class="btn-modal" id="modalBtn">❤️ 阿们，继续前行</button>
        </div>
    </div>

    <script>
        // ================================================================
        // ★★★★★ 【数据填充区】★★★★★
        // ================================================================

        const courseData = [
            // ================================================================
            // 🌱 第一周 · 信仰的根基：试炼与成熟（周一至周六，第1-6课）
            // ================================================================

            {
                day: 1,
                title: "第1课 · 认识雅各：从怀疑到仆人的蜕变",
                reading: `
                    <p>雅各书的作者，是主耶稣肉身的兄弟。他曾经不信耶稣（约7:5），但在主复活后向他显现，他彻底改变，成为耶路撒冷教会的领袖（加2:9，徒15:13-33）。</p>
                    <p>雅各不自称"主的兄弟"，而自称"神和主耶稣基督的仆人"（雅1:1）。在希腊文中，"仆人"就是"奴仆"的意思——完全属于主人，没有自己的主权。</p>
                    <div class="highlight-block">✨ 关键洞察：与他同称"仆人"的还有保罗、彼得、犹大。这不是自贬，而是灵命成熟的标记。一个不成熟的人是自我中心的，一个成熟的人是甘愿为仆的。</div>
                    <p>传说雅各因跪着长期祷告，膝盖起了厚茧。主后62年，他从圣殿顶被扔下，又被棍打死。殉道前，他像主一样祷告："父啊，赦免他们，因为他们所作的他们不晓得。"</p>
                `,
                hook: "雅各从"不信的兄弟"变成"甘心为仆的人"。在你的信仰历程中，有没有一个"转折点"让你对主的认识发生了根本改变？请描述那个时刻（或你期待的那个时刻）。"
            },
            {
                day: 2,
                title: "第2课 · 试炼中的大喜乐",
                reading: `
                    <p>雅各没有说"如果你们遇见试炼"，而是说"你们落在百般试炼中"——因为基督徒必定会遇到试炼。耶稣说："在世上你们有苦难"（约16:33）。保罗也说："我们进入神的国，必须经历许多艰难"（徒14:22）。</p>
                    <p>试炼是"百般的"——各种各样的：疾病、意外、失望、逼迫。有些是因为我们是人而有的，有些是因为我们是基督徒而有的。</p>
                    <p>但雅各的命令是："<strong>都要以为大喜乐</strong>"。这不是说试炼本身是快乐的，而是说我们可以在试炼中喜乐，因为我们知道——信心经过试炼，就生忍耐；忍耐当成功，就使我们"成全完备，毫无缺欠"。</p>
                    <div class="highlight-block">✨ 关键洞察："忍耐"在希腊原文中的意思是"在重压之下坚定不移"。不是被动忍受，而是主动坚持。就像运动员在阻力训练中变强，我们的信心在试炼中被炼净。</div>
                `,
                hook: "你正在经历或最近经历过什么"试炼"？如果雅各说"要以为大喜乐"，你觉得自己最难认同的是什么？请诚实地写下你的挣扎。"
            },
            {
                day: 3,
                title: "第3课 · 求智慧的祷告",
                reading: `
                    <p>"你们中间若有缺少智慧的，应当求那厚赐与众人、也不斥责人的神，主就必赐给他。"（雅1:5）</p>
                    <p>这里有一个重要的区别：<strong>"知识"</strong>是资料的积累，<strong>"智慧"</strong>是知道如何正确运用知识。许多人读了圣经，却不知道如何应用——这就是缺少智慧。</p>
                    <p>所罗门求智慧，神喜悦他（王上3:7-12）。神应许"厚赐"——慷慨地给；"不斥责"——不会因为你求而责备你。</p>
                    <div class="highlight-block">✨ 关键洞察：但有一个条件——凭着信心求，一点不疑惑。疑惑的人就像海中的波浪，被风吹动翻腾。这样的人不要想从主那里得什么。</div>
                `,
                hook: "你最近是否在某个具体处境中"不知道该怎么办"？如果今天你向神求智慧，你最需要祂指引的是哪一件事？请写出来。"
            },
            {
                day: 4,
                title: "第4课 · 贫穷与富足的试炼",
                reading: `
                    <p>雅各提到两种极端处境："贫穷"和"富足"——两者都是试炼。</p>

                dot.className = 'day-dot';
                const isSabbath = courseData[i] && courseData[i].isSabbath === true;
                if (isSabbath) dot.classList.add('sabbath');
                dot.textContent = isSabbath ? '🕊️' : (i + 1);
                if (state.completedDays.includes(i)) {
                    dot.classList.add('completed');
                } else if (i === state.currentDay) {
                    dot.classList.add('active');
                } else if (i > state.currentDay) {
                    dot.classList.add('future');
                }
                calendarGrid.appendChild(dot);
            }
        }

        // --- 更新步骤 UI 解锁状态 ---
        function updateStepsUI() {
            const s = state.steps;
            const isSabbath = isSabbathDay(state.currentDay);

            // 如果是安息日，特殊处理
            if (isSabbath) {
                mainCard.classList.add('sabbath-mode');
                // 但让用户能看到阅读内容
                step1.classList.add('unlocked');
                step2.classList.remove('unlocked');
                step3.classList.remove('unlocked');
                step4.classList.remove('unlocked');
                // 禁用所有输入
                inputStep2.disabled = true;
                inputStep3.disabled = true;
                inputStep4.disabled = true;
                btnStep1.disabled = true;
                btnStep2.disabled = true;
                btnStep3.disabled = true;
                btnStep4.disabled = true;
                btnCompleteDay.disabled = true;
                btnCompleteDay.textContent = '🕊️ 今天是安息日';
                timerHint.textContent = '🕊️ 安息日 · 享受神的同在';
                timerHint.style.color = '#B8A188';
                // 更新进度环显示
                const pct = 100;
                const circumference = 138.23;
                const offset = circumference - (pct / 100) * circumference;
                ringProgress.style.strokeDashoffset = offset;
                ringLabel.textContent = '🕊️';
                progressText.textContent = '今日安息 · 默想';
                daySubStatus.textContent = '🕊️ 安息日';
                return;
            } else {
                mainCard.classList.remove('sabbath-mode');
            }

            // Step1 永远解锁（只要不是已完成）
            step1.classList.add('unlocked');
            if (s[1].completed) step1.classList.add('completed');
            else step1.classList.remove('completed');

            // Step2 解锁条件：step1 完成
            if (s[1].completed) {
                step2.classList.add('unlocked');
                inputStep2.disabled = false;
            } else {
                step2.classList.remove('unlocked');
                inputStep2.disabled = true;
            }
            if (s[2].completed) { step2.classList.add('completed');
                inputStep2.disabled = true; } else step2.classList.remove('completed');

            // Step3 解锁条件：step2 完成
            if (s[2].completed) {
                step3.classList.add('unlocked');
                inputStep3.disabled = false;
            } else {
                step3.classList.remove('unlocked');
                inputStep3.disabled = true;
            }
            if (s[3].completed) { step3.classList.add('completed');
                inputStep3.disabled = true; } else step3.classList.remove('completed');

            // Step4 解锁条件：step3 完成
            if (s[3].completed) {
                step4.classList.add('unlocked');
                inputStep4.disabled = false;
            } else {
                step4.classList.remove('unlocked');
                inputStep4.disabled = true;
            }
            if (s[4].completed) { step4.classList.add('completed');
                inputStep4.disabled = true; } else step4.classList.remove('completed');

            // 按钮文本更新
            btnStep1.textContent = s[1].completed ? '✅ 已完成静读' : '⏳ 我已读完 (需停留 30 秒)';
            btnStep2.textContent = s[2].completed ? '✅ 已捕获' : '✅ 确认捕获';
            btnStep3.textContent = s[3].completed ? '✅ 已联结' : '✅ 确认联结';
            btnStep4.textContent = s[4].completed ? '✅ 已应用' : '✅ 确认应用';

            // 按钮禁用
            btnStep1.disabled = s[1].completed || !s[1].timerDone;
            btnStep2.disabled = s[2].completed || inputStep2.value.length < 10;
            btnStep3.disabled = s[3].completed || inputStep3.value.length < 10;
            btnStep4.disabled = s[4].completed || inputStep4.value.length < 10;

            // 更新计时器提示
            if (!s[1].completed && s[1].timerDone) {
                timerHint.textContent = '✅ 已满 30 秒，可以点击完成静读！';
                timerHint.style.color = '#2A4B41';
            } else if (!s[1].completed) {
                timerHint.textContent = `⏱️ 请阅读至少 30 秒 (已读 ${timerSeconds}s)`;
                timerHint.style.color = '#8AA39A';
            } else {
                timerHint.textContent = '📖 静读已完成';
                timerHint.style.color = '#6B8A7A';
            }

            // 更新计数
            count2.textContent = inputStep2.value.length;
            count3.textContent = inputStep3.value.length;
            count4.textContent = inputStep4.value.length;

            // 更新进度环
            const pct = getProgressPercent();
            const circumference = 138.23;
            const offset = circumference - (pct / 100) * circumference;
            ringProgress.style.strokeDashoffset = offset;
            ringLabel.textContent = pct + '%';
            progressText.textContent = `今日 ${getStepCount()} / 4 步`;

            // 完成按钮
            const allDone = s[1].completed && s[2].completed && s[3].completed && s[4].completed;
            if (allDone) {
                btnCompleteDay.disabled = false;
                btnCompleteDay.textContent = '🎉 完成今日学习！';
            } else {
                btnCompleteDay.disabled = true;
                btnCompleteDay.textContent = `🔒 完成全部 4 步 (${getStepCount()}/4)`;
            }

            // 状态文本
            if (allDone) daySubStatus.textContent = '✅ 已完成';
            else if (getStepCount() > 0) daySubStatus.textContent = `🌱 进行中 (${getStepCount()}/4)`;
            else daySubStatus.textContent = '🌱 未开始';
        }

        // --- 加载当日课程 ---
        function loadDay(index) {
            const data = courseData[index];
            if (!data) return;
            currentDayData = data;

            const totalDays = courseData.length;
            dayBadge.textContent = `第 ${index+1} / ${totalDays} 天`;
            dayTitle.textContent = data.title;
            daySubDate.textContent = `📅 第 ${index+1} 课`;

            // 阅读内容
            readingContent.innerHTML = data.reading;
            // 钩子问题
            hookQuestionText.innerHTML = `🕊️ ${data.hook}`;

            // 重置计时器 (如果当天没完成step1)
            if (!state.steps[1].completed && !isSabbathDay(index)) {
                timerSeconds = 0;
                isTimerRunning = false;
                state.steps[1].timerDone = false;
                if (timerInterval) { clearInterval(timerInterval);
                    timerInterval = null; }
            }

            // 从状态中恢复文本输入
            inputStep2.value = state.steps[2].text || '';
            inputStep3.value = state.steps[3].text || '';
            inputStep4.value = state.steps[4].text || '';

            // 如果 step1 未完成且未开始计时，且不是安息日，启动计时
            if (!state.steps[1].completed && !state.steps[1].timerDone && !isSabbathDay(index)) {
                if (timerInterval) clearInterval(timerInterval);
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    if (timerSeconds >= 30) {
                        state.steps[1].timerDone = true;
                        updateStepsUI();
                        if (timerInterval) clearInterval(timerInterval);
                        timerInterval = null;
                    }
                    updateStepsUI();
                }, 1000);
            }

            renderCalendar();
            updateStepsUI();
            saveState();
        }

        // --- 完成步骤 ---
        function completeStep(stepNum) {
            if (isSabbathDay(state.currentDay)) return;

            if (stepNum === 1) {
                if (!state.steps[1].timerDone) return;
                state.steps[1].completed = true;
                if (timerInterval) { clearInterval(timerInterval);
                    timerInterval = null; }
                showCelebration(1);
            } else if (stepNum === 2) {
                const text = inputStep2.value.trim();
                if (text.length < 10) return;
                state.steps[2].text = text;
                state.steps[2].completed = true;
                showCelebration(2);
            } else if (stepNum === 3) {
                const text = inputStep3.value.trim();
                if (text.length < 10) return;
                state.steps[3].text = text;
                state.steps[3].completed = true;
                showCelebration(3);
            } else if (stepNum === 4) {
                const text = inputStep4.value.trim();
                if (text.length < 10) return;
                state.steps[4].text = text;
                state.steps[4].completed = true;
                showCelebration(4);
            }
            updateStepsUI();
            saveState();
            if (getStepCount() === 4) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // --- 完成今日 ---
        function completeDay() {
            if (isSabbathDay(state.currentDay)) return;

            const allDone = state.steps[1].completed && state.steps[2].completed && state.steps[3].completed && state
                .steps[4].completed;
            if (!allDone) return;

            if (!state.completedDays.includes(state.currentDay)) {
                state.completedDays.push(state.currentDay);
            }

            const completedCount = state.completedDays.length;
            let milestoneMsg = '';
            if (completedCount === 7) milestoneMsg = '🎉 七天！你已跨越第一个山峰！';
            else if (completedCount === 14) milestoneMsg = '🔥 十四天！你的生命正在被更新！';
            else if (completedCount === 21) milestoneMsg = '👑 二十一天！新造的人！旧事已过，都变成新的了！';

            if (state.currentDay < courseData.length - 1) {
                state.steps = { 1: { completed: false, timerDone: false }, 2: { completed: false, text: '' },
                    3: { completed: false, text: '' }, 4: { completed: false, text: '' } };
                state.currentDay++;
                while (state.completedDays.includes(state.currentDay) && state.currentDay < courseData.length - 1) {
                    state.currentDay++;
                }
                loadDay(state.currentDay);

                if (milestoneMsg) {
                    setTimeout(() => {
                        const verse = getRandomVerse();
                        modalEmoji.textContent = '🎊';
                        modalTitle.textContent = milestoneMsg;
                        modalVerse.textContent = `“${verse.text}”`;
                        modalRef.textContent = `— ${verse.ref}`;
                        modalOverlay.classList.add('show');
                        burstStars();
                    }, 400);
                } else {
                    setTimeout(() => {
                        const verse = getRandomVerse();
                        modalEmoji.textContent = '🌅';
                        modalTitle.textContent = '你忠于今日的托付！';
                        modalVerse.textContent = `“${verse.text}”`;
                        modalRef.textContent = `— ${verse.ref}`;
                        modalOverlay.classList.add('show');
                        burstStars();
                    }, 400);
                }
            } else {
                setTimeout(() => {
                    modalEmoji.textContent = '🕊️';
                    modalTitle.textContent = '🏁 你完成了全部 24 天旅程！';
                    modalVerse.textContent =
                    `“那美好的仗我已经打过了，当跑的路我已经跑尽了，所信的道我已经守住了。”`;
                    modalRef.textContent = '— 提摩太后书 4:7';
                    modalOverlay.classList.add('show');
                    burstStars();
                }, 400);
                btnCompleteDay.disabled = true;
                btnCompleteDay.textContent = '🎉 全部完成！哈利路亚！';
            }
            saveState();
        }

        // --- 事件绑定 ---
        function initEvents() {
            btnStep1.onclick = () => completeStep(1);
            btnStep2.onclick = () => completeStep(2);
            btnStep3.onclick = () => completeStep(3);
            btnStep4.onclick = () => completeStep(4);
            btnCompleteDay.onclick = completeDay;

            inputStep2.oninput = () => { state.steps[2].text = inputStep2.value;
                updateStepsUI();
                saveState(); };
            inputStep3.oninput = () => { state.steps[3].text = inputStep3.value;
                updateStepsUI();
                saveState(); };
            inputStep4.oninput = () => { state.steps[4].text = inputStep4.value;
                updateStepsUI();
                saveState(); };

            readingContent.addEventListener('click', (e) => {
                const target = e.target.closest('p, .highlight-block');
                if (target && !state.steps[2].completed && state.steps[1].completed && !isSabbathDay(state
                        .currentDay)) {
                    let text = target.textContent.trim();
                    if (text.length > 0) {
                        inputStep2.value = text;
                        state.steps[2].text = text;
                        updateStepsUI();
                        saveState();
                        target.style.transition = '0.1s';
                        target.style.backgroundColor = '#DCE9E3';
                        setTimeout(() => { target.style.backgroundColor = ''; }, 300);
                    }
                }
            });

            modalBtn.onclick = () => { modalOverlay.classList.remove('show'); };
            modalOverlay.onclick = (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove('show'); };
        }

        // --- 初始化 ---
        function init() {
            loadState();
            while (state.completedDays.includes(state.currentDay) && state.currentDay < courseData.length - 1) {
                state.currentDay++;
            }
            if (state.currentDay >= courseData.length) {
                state.currentDay = courseData.length - 1;
            }
            loadDay(state.currentDay);
            initEvents();
        }

        init();
        console.log('🌱 晨光书房已开启！愿你每日得着智慧。');
    </script>
</body>
</html>
